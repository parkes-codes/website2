name: Update Config Data

on:
  push:
    branches:
      - main
      - master

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update JS Variable
        run: |
          DATE=$(date +"%Y-%m-%d")
          sed -i "s/const updated = \".*\";/const updated = \"${DATE}\";/" config.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add config.js
          git commit -m "chore: auto-update tracking date" || echo "No changes to commit"
          git push
