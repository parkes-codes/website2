name: Update Config Date

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master

jobs:
  update-date:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update JS Variable
        run: |
          DATE=$(date +"%Y-%m-%d")
          sed -i "s/const updated = \".*\";/const updated = \"${DATE}\";/" js/config.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git commit -m "chore: auto-update tracking date" || echo "No changes to commit"
          git push