<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibrate Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    button {
      font-size: 1.5rem;
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      background: #bff;
      color: #000;
      cursor: pointer;
      box-shadow: 0 4px 16px #0008;
      margin-top: 24px;
      transition: background, transform 0.2s;
    }
    button:hover {
      background: #eff;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <button onclick="vibrateDevice()">Vibrate</button>

  <script>
    function vibrateDevice() {
      if ("vibrate" in navigator) {
        navigator.vibrate([300]);
      } else {
        alert("Vibration API is not supported on this device.");
      }
    }
  </script>
</body>
</html>
