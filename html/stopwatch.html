<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stopwatch</title>
    <link rel="icon" type="image/x-icon" href="../images/icon.ico" />
</head>
<style>
    body {
        background-color: #000;
        overflow: hidden;
    }
      #gamecanvas {
        border-radius: 10px;
        width: 1px;
        height: 1px;
        position: relative;
        border: #ffff 5px solid;
        z-index: 1;
        display: block;
        justify-self: center;
        background: none;
      }

      #btnsrow {
        justify-self: center;
        display: flex;
        flex-direction: row;
        gap: 50px;
        margin-top: 8px;
      }
      .buttons {
        width: 60px;
        height: 50px;
        font-size: 22px;
        background: #333;
        border: #cff 2px solid;
        border-radius: 10px;
        color: #fff;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        transition: background 500ms,transform 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);
      }
      .buttons:hover {
        background: #111;
        transform: scale(1.08);
      }
 

</style>
<body>

 <canvas id="gamecanvas"></canvas>
 <div id="btnsrow">
    <button class = "buttons" id="fast">2x</button>
    <button class = "buttons" id="slow">.5x</button>
    <button class = "buttons" style="font-family: Arial, Helvetica, sans-serif;" id="pause">▶︎</button>
    <button class = "buttons" id="reset">↻</button>
 </div>


</body>
<script>
const canvas = document.getElementById("gamecanvas");
const ctx = canvas.getContext('2d');         
const scale =  1.65;
canvas.width = 1000;
canvas.height = 1000;
canvas.style.width = "400px";
canvas.style.height = "500px";
ctx.setTransform(scale*(5/4), 0, 0, scale, 0, 0); 

let keysPressed = [];

let fps = 60;
let fpsHist = [];
let fpsAv = 0;

let paused = true;
let time = 0;
let speedMult = 1;

let cx = 0, cy = 0;

function formatime(seconds) {
    if (typeof seconds !== "number" || isNaN(seconds)) return "0.000";

    let days = Math.floor(seconds / 86400);
    let hrs = Math.floor((seconds % 86400) / 3600);
    let mins = Math.floor((seconds % 3600) / 60);
    let secs = Math.floor(seconds % 60);
    let millis = Math.floor((seconds % 1) * 1000);

    const twoDigits = n => n.toFixed(0).padStart(2, "0");
    const threeDigits = n => n.toFixed(0).padStart(3, "0");

    let output = "";

    if (days > 0) {
        let hrsStr = hrs.toString();
        if (hrs < 10) {
            hrsStr = hrsStr.padStart(2, "0");
        }
        output += `${days}:`;
        output += `${hrsStr}:`;
        output += `${twoDigits(mins)}:${twoDigits(secs)}.${threeDigits(millis)}`;
    } else if (hrs > 0) {
        output += `${hrs}:${twoDigits(mins)}:${twoDigits(secs)}.${threeDigits(millis)}`;
    } else if (mins > 0) {
        output += `${mins}:${twoDigits(secs)}.${threeDigits(millis)}`;
    } else {
        output += `${secs}.${threeDigits(millis)}`;
    }

    return output;
}

function drawBand(div,rad,i) {
    ctx.lineCap = "butt";
    ctx.strokeStyle = `hsl(${(i-1)*(360/20)},50%,50%)`;
    ctx.beginPath()
    const timeFix = time < 0.1 ? 0.0001*div : time
    ctx.arc(cx,cy-100,rad,Math.PI/-2,(timeFix*Math.PI*2)/div%Math.PI*2-Math.PI/2);
    ctx.stroke();
}

function drawBar(div,i,y,ireal) {
    if (ireal > 18) return;
    ctx.strokeStyle = `hsl(${(ireal)*(360/20)},50%,50%)`;
    ctx.fillStyle = ctx.strokeStyle;
    const timeFix = time < 0.1 ? 0.0001*div : time
    ctx.fillRect(cx-200+i*(2.1),cy+y,22,(timeFix/div%1)*-100-5)
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if (!paused) {
        time+=speedMult/fps;
    }

     cx = 240;
     cy = 430;



     ctx.fillStyle = "#fff";
     ctx.font = "40px monospace";
     ctx.textAlign = "center";
     ctx.fillText(`${formatime(time)}`,cx,cy+150);
     ctx.restore();

     ctx.fillStyle = "#fff"
     ctx.fillRect(cx-205,cy+105-405,410,-115);
     ctx.fillStyle = "#000"
     ctx.fillRect(cx-200,cy+100-405,400,-105);

     ctx.beginPath()
     ctx.lineWidth = 3;
     ctx.strokeStyle = "#fff";
     ctx.arc(cx,cy-100,197,Math.PI/-2,Math.PI*2);
     ctx.stroke();

     ctx.lineWidth = 10;
     for(let i = 0; i<20; i++) {
        drawBand(Math.pow(2,i),i*10,i)
        drawBar(Math.pow(2,i),i*10,-305,i)
     };



    requestAnimationFrame(draw);
}

draw();


window.addEventListener("keydown", (e) => {
  keysPressed[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (e) => {
  keysPressed[e.key.toLowerCase()] = false;
});


    let lastPerfNow = performance.now();
    function checkTimeJump() {
        const now = performance.now();
        const delta = now - lastPerfNow;

        if (delta > 10000 && !paused) {
            time += (delta / 1000)*speedMult;
        }
        lastPerfNow = now;
        requestAnimationFrame(checkTimeJump);
    }
    checkTimeJump();



   
    document.getElementById("pause").addEventListener("click", (e) => {
        paused = !paused;
        document.getElementById("pause").textContent = paused ? "▶︎" : "II"
    });
    
    document.getElementById("reset").addEventListener("click", (e) => {
        paused = true;
        document.getElementById("pause").textContent = paused ? "▶︎" : "II"
        speedMult = 1;
        time = 0;
    });
        
    
    document.getElementById("fast").addEventListener("click", (e) => {
        speedMult= Math.min(speedMult*2,Math.pow(10,6));
    });

    document.getElementById("slow").addEventListener("click", (e) => {
        speedMult = Math.max(speedMult/2,Math.pow(10,-2));
    });
    
    
        
    


let lastTimestamp;
function sampleFPS() {
    const now = performance.now();
    const delta = now - lastTimestamp;

    if (delta > 0 && delta < 1000) {
        fps = 1000 / delta;
    }
    fpsHist.unshift(fps)
    fpsAv = 0;
    for (let i = 0; i<fpsHist.length; i++) {
        fpsAv+=fpsHist[i];
    }
    fpsAv/=fpsHist.length
    if (fpsHist[60]) {fpsHist.splice(60,1)}
    lastTimestamp = now;

    requestAnimationFrame(sampleFPS);
}
sampleFPS();

</script>
</html>
