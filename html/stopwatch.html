<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Title Here</title>
    <link rel="icon" type="image/x-icon" href="../images/icon.ico" />
</head>
<style>
    body {
        background-color: #000;
        overflow: hidden;
    }
      #gamecanvas {
        border: #fff 5px solid;
        border-radius: 10px;
        width: calc(100vw - 11px);
        height: calc(100vh - 11px);
        margin-left: -8px;
        margin-top: -8px;
        position: relative;
        z-index: 1;
        display: block;
        background: none;
    }
</style>
<body>

 <canvas id="gamecanvas"></canvas>


</body>
<script>
const canvas = document.getElementById("gamecanvas");
const ctx = canvas.getContext('2d');
let keysPressed = [];

let fps = 60;
let fpsHist = [];
let fpsAv = 0;

let mx = 99999, my = 99999, md = false;
let cx = 0, cy = 0;

function updateMousePosition(e) {
    const rect = canvas.getBoundingClientRect();
    mx = canvas.width/-2 + ((e.clientX - rect.left) * (canvas.width / rect.width));
    my = canvas.height/2 - ((e.clientY - rect.top) * (canvas.height / rect.height));

}
canvas.addEventListener('mousemove', updateMousePosition);

function drawPauseBtn(color) {
    ctx.lineCap = "round";
    ctx.save();
    ctx.lineWidth = 10;
    let length = 30
    let height = 40;
    let ypos = -150;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx-length,cy - ypos);
    ctx.lineTo(cx+length,cy - ypos);
    ctx.stroke();
    ctx.moveTo(cx+length,cy - ypos);
    ctx.lineTo(cx+length,cy-height - ypos);
    ctx.stroke();
    ctx.moveTo(cx+length,cy-height - ypos);
    ctx.lineTo(cx-length,cy-height - ypos);
    ctx.stroke();
    ctx.moveTo(cx-length,cy-height - ypos);
    ctx.lineTo(cx-length,cy - ypos);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle=color;
    ctx.fillRect(cx-length,cy-height - ypos,length*2,height);

    ctx.font = "35px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle="#333";
    const temp  = paused ? 6 : 8
    ctx.fillText(`${paused ? "▶︎" : "II"}`,cx,cy-temp - ypos);

    ctx.restore();
}

function drawResetBtn(color) {
    let xpos = 100;
    ctx.lineCap = "round";
    ctx.save();
    ctx.lineWidth = 10;
    let length = 30;
    let height = 40;
    let ypos = -150;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx + xpos - length, cy - ypos);
    ctx.lineTo(cx + xpos + length, cy - ypos);
    ctx.stroke();
    ctx.moveTo(cx + xpos + length, cy - ypos);
    ctx.lineTo(cx + xpos + length, cy - height - ypos);
    ctx.stroke();
    ctx.moveTo(cx + xpos + length, cy - height - ypos);
    ctx.lineTo(cx + xpos - length, cy - height - ypos);
    ctx.stroke();
    ctx.moveTo(cx + xpos - length, cy - height - ypos);
    ctx.lineTo(cx + xpos - length, cy - ypos);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle=color;
    ctx.fillRect(cx + xpos - length, cy - height - ypos, length * 2, height);

    ctx.font = "40px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle="#333";
    const temp  = 10
    ctx.fillText("↺", cx + xpos, cy - temp - ypos);

    ctx.restore();
}


function formatime(seconds) {
    if (typeof seconds !== "number" || isNaN(seconds)) return "0.000";

    let hrs = Math.floor(seconds / 3600);
    let mins = Math.floor((seconds % 3600) / 60);
    let secs = Math.floor(seconds % 60);
    let millis = Math.floor((seconds % 1) * 1000);

    const twoDigits = n => n.toFixed(0).padStart(2, "0");
    const threeDigits = n => n.toFixed(0).padStart(3, "0");

    if (hrs > 0) {
        return `${hrs}:${twoDigits(mins)}:${twoDigits(secs)}.${threeDigits(millis)}`;
    } else if (mins > 0) {
        return `${mins}:${twoDigits(secs)}.${threeDigits(millis)}`;
    } else {
        return `${secs}.${threeDigits(millis)}`;
    }
}


let pauseHover = false;
let resetHover = false;
let paused = false;
let time = 0;

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if (!paused) {
        time+=1/fps;
    }

     cx = canvas.width/2;
     cy = canvas.height/2;

     let btnColor = "";
     if (Math.abs(mx)<35 && my<46-150 && my>-6-150) {
        pauseHover = true;
     } else {
        pauseHover = false;
     }
     if ((mx)<135 && mx > 66 && my<46-150 && my>-6-150) {
        resetHover = true;
     } else {
        resetHover = false;
     }


     btnColor = pauseHover ? md ? "#999" : "#bbb" : "#eee" // peak coding
     drawPauseBtn(btnColor);
     btnColor = resetHover ? md ? "#999" : "#bbb" : "#eee" // peak coding
     drawResetBtn(btnColor)

     ctx.fillStyle = "#fff";
     ctx.font = "40px monospace";
     ctx.textAlign = "center";
     ctx.fillText(`${formatime(time)}`,cx,cy);
     ctx.restore();

     ctx.strokeStyle = "#3689d78a";
     ctx.lineWidth = 30
     ctx.beginPath()
     ctx.arc(cx,cy,300,0,Math.PI*2);
     ctx.stroke();
     ctx.strokeStyle = "#ffffff50";
     ctx.beginPath()
     ctx.arc(cx,cy,300,Math.PI/-2,Math.PI/-2+time%1*Math.PI*2);
     ctx.stroke();
     ctx.beginPath()
     ctx.arc(cx,cy,300,Math.PI/-2,Math.PI/-2+time/15%1*Math.PI*2);
     ctx.stroke();
     ctx.beginPath()
     ctx.arc(cx,cy,300,Math.PI/-2,Math.PI/-2+time/60%1*Math.PI*2);
     ctx.stroke();
     ctx.beginPath()
     ctx.arc(cx,cy,300,Math.PI/-2,Math.PI/-2+time/3600%1*Math.PI*2);
     ctx.stroke();

    requestAnimationFrame(draw);
}

draw();

function resizeCanvas() {
  canvas.width = (window.innerWidth) - 25;
  canvas.height = (window.innerHeight) - 25;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

window.addEventListener("keydown", (e) => {
  keysPressed[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (e) => {
  keysPressed[e.key.toLowerCase()] = false;
});

window.addEventListener("pointerdown", () =>
{
    md = true;
    if (pauseHover) {
        paused = !paused;
    }
    if (resetHover) {
        paused = true;
        time = 0;
    }
})

window.addEventListener("pointerup", () => {md = false})

let lastTimestamp;
function sampleFPS() {
    const now = performance.now();
    const delta = now - lastTimestamp;

    if (delta > 0 && delta < 1000) {
        fps = 1000 / delta;
    }
    fpsHist.unshift(fps)
    fpsAv = 0;
    for (let i = 0; i<fpsHist.length; i++) {
        fpsAv+=fpsHist[i];
    }
    fpsAv/=fpsHist.length
    if (fpsHist[60]) {fpsHist.splice(60,1)}
    lastTimestamp = now;

    requestAnimationFrame(sampleFPS);
}
sampleFPS();

</script>
</html>
