<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret</title>
  <style>
    body {
      background: radial-gradient(ellipse at center, #430000 0%, #100 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      font-family: 'Impact', 'Arial Black', Geneva, sans-serif;
      letter-spacing: 1px;
      user-select: none;
      margin: 0;
      transition:
        filter 0.5s cubic-bezier(.4,0,.2,1),
        background 0.5s cubic-bezier(.4,0,.2,1);
    }

    #blackbg {
      width: 100%;
      height: 100%;
      margin: 0;
      position: absolute;
      top: 0px;
      left: 0px;
      z-index: -1;
      background-color: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(.4,0,.2,1);
    }
    #blackbg.visible {
      opacity: 1;
      pointer-events: auto;
    }

    body.bw-mode {
      filter: grayscale(1);
      transition: filter 0.6s cubic-bezier(.4,0,.2,1), background 0.5s cubic-bezier(.4,0,.2,1);
    }
    body.bw-mode h1,
    body.bw-mode .warning,
    body.bw-mode .danger-btn {
      box-shadow: none !important;
      text-shadow: none !important;
      filter: none !important;
    }
    /* Ensure plinkk-gif is never affected by bw-mode's grayscale filter */
    #plinkk-gif {
      filter: none !important;
      transition: opacity 0.5s cubic-bezier(.4,0,.2,1), transform 0.25s linear;
      opacity: 100%;
      /* Default scale for smooth animation start */
      transform: scale(1);
    }

    h1 {
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000, 0 0 30px #400, 0 0 40px black;
      font-size: 2.5em;
      margin-bottom: 40px;
      letter-spacing: 4px;
      transition: text-shadow 0.5s;
    }
    .warning {
      color: #fffde2;
      background: transparent;
      font-size: 1.4em;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #750, 0 0 18px #333;
      font-weight: bold;
      border: none;
      transition: text-shadow 0.5s;
    }
    .danger-btn {
      background: linear-gradient(135deg, #ff3c00 0%, #8b0000 100%);
      color: #fff;
      border: 4px solid #ff0000;
      box-shadow: 0 0 30px 10px #a30000, 0 0 10px 2px #ff0000, 0 0 80px 8px #ff0000 inset;
      font-size: 2.2em;
      font-family: 'Impact', 'Arial Black', Geneva, sans-serif;
      text-shadow: 0 0 15px #fff, 0 0 6px #ff0000;
      border-radius: 12px;
      padding: 36px 86px;
      cursor: pointer;
      animation: pulse 1.2s infinite alternate, shake 0.5s infinite steps(2, jump-none);
      transition: box-shadow 0.2s, transform 0.11s, text-shadow 0.5s, opacity 0.5s cubic-bezier(.4,0,.2,1), transform 1s cubic-bezier(.4,0,.2,1);
      outline: none;
      margin: 38px 0 16px 0;
      z-index: 99;
      position: relative;
    }
    .danger-btn.grow-fade {
      opacity: 0;
      transform: scale(10);
      transition: 
        opacity 0.8s cubic-bezier(.4,0,.2,1), 
        transform 1s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .danger-btn:hover, .danger-btn:active {
      background: linear-gradient(135deg, #b90000 30%, #3d0000 100%);
      color: #ffeaea;
      box-shadow: 0 0 60px 20px #ff0000, 0 0 14px 5px #fc0, 0 0 160px 22px #ff0000 inset;
      transform: scale(0.93);
      text-shadow: 0 0 35px #ff0000, 0 0 16px #fff;
    }
    @keyframes pulse {
      from { box-shadow: 0 0 25px 10px #ab0000, 0 0 50px 5px #6f0000 inset; }
      to { box-shadow: 0 0 80px 35px #ff0000, 0 0 180px 30px #8b0000 inset; }
    }
  </style>
</head>
<body>
    <div id="blackbg"></div> 
    <h1 id="topsecret-title">TOP SECRET</h1>
    <div class="warning" id="warning-msg">DO <span style="color: #ff0000; text-decoration:underline;">NOT</span> PRESS THE BUTTON BELOW</div>
    <button class="danger-btn" style="z-index: 99;">DO NOT CLICK</button>
    <!-- Use <img> not <image>; add style filter:none for plinkk-gif -->
    <img id="plinkk-gif" src="plinkk.gif" style="left: calc(50% - 50px); top: calc(50% - 50px); width: 100px; height:100px; position: absolute; z-index: 5;  opacity: 0; filter: none !important;">

  <script>
    // Get button, blackbg overlay, and plinkk image
    const btn = document.querySelector('.danger-btn');
    const blackbg = document.getElementById('blackbg');
    const plinkkImg = document.getElementById('plinkk-gif');
    const title = document.getElementById('topsecret-title');
    const warningMsg = document.getElementById('warning-msg');

    let t = 0;
    let crazyMode = false;
    let crazyFired = false;
    let audio = null;

    function thingy() {
      t+=1/60
      if (!crazyMode) {
        if (t < 5) {
          plinkkImg.style.transform = `scale(${t/3})`;
        } else {
          plinkkImg.style.transform = `scale(${5/3})`;
        }
      } else {
        plinkkImg.style.transform = `scale(${Math.sin(t*20)*10+7}) rotate(${t*500}deg)`;
      }
      plinkkImg.style.opacity = `${Math.min(t*200,100)}%`;
      // Always force filter:none, in case body.bw-mode is present
      plinkkImg.style.filter = "none";
      requestAnimationFrame(thingy)
    }

    function triggerCrazyMode() {
      if (!crazyMode) {
        crazyMode = true;
      }
    }

    // On button hover, animate blackbg to opacity 100%
    btn.addEventListener('mouseenter', function() {
      document.body.classList.add('bw-mode');
      if (blackbg) blackbg.classList.add('visible');
    });
    btn.addEventListener('mouseleave', function() {
      document.body.classList.remove('bw-mode');
      if (blackbg) blackbg.classList.remove('visible');
    });

    // On click: fade/grow the button, but do all other actions in parallel (not waiting for the fade)
    btn.addEventListener('click', function() {
      // Start grow and fade the button
      btn.classList.add('grow-fade');

      // Begin all the rest of the animation sequence (no waiting for the fade)
      document.body.classList.add('bw-mode');
      if (blackbg) blackbg.classList.add('visible');

      // Wait for grayscale/overlay transition (0.6s) + (most of) fade-in (0.5s, overlap a bit)
      setTimeout(function() {
        document.body.style.background = "black";

        // Hide the title, warning, and overlay (btn already handled)
        if (title) title.style.display = "none";
        if (warningMsg) warningMsg.style.display = "none";
        if (btn) btn.style.display = "none";
        if (blackbg) blackbg.style.display = "none";

        // Plinkk still visible

        document.body.style.transition = "background 0.5s";
        setTimeout(function() {
          audio = document.createElement('audio');
          audio.src = 'outro.wav';
          audio.autoplay = true;
          audio.style.display = "none";
          document.body.appendChild(audio);

          if (plinkkImg) {
            plinkkImg.style.display = "block"
            t = 0;
            crazyMode = false;
            crazyFired = false;
            plinkkImg.style.filter = "none";
            thingy();

            // Use timeupdate for accurate switching
            audio.addEventListener('timeupdate', function checkAudioTime() {
              if (!crazyFired && audio.currentTime >= 5) {
                crazyFired = true;
                triggerCrazyMode();
                audio.removeEventListener('timeupdate', checkAudioTime);
              }
            });

            // If the user skips the audio, catch up!
            audio.addEventListener('seeked', function checkAudioSeek() {
              if (!crazyFired && audio.currentTime >= 5) {
                crazyFired = true;
                triggerCrazyMode();
                audio.removeEventListener('seeked', checkAudioSeek);
              }
            });
          }
        }, 500);
      }, 900);
    });

    // Ensure plinkk is NEVER grayscale on load (e.g. if page is refreshed)
    window.addEventListener('DOMContentLoaded', () => {
      if (plinkkImg) {
        plinkkImg.style.filter = "none";
      }
    });
  </script>
</body>
</html>
