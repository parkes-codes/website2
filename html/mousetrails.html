<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mouse Trails</title>
    <link rel="icon" type="image/x-icon" href="../images/icon.ico" />
</head>
<style>
    body {
        background-color: #000;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    #gamecanvas {
      border: #fff 10px solid;
      border-radius: 10px;
      width: calc(100vw - 20px);
      height: calc(100vh - 20px);
      background-color: #010303;
      margin-left: 0px;
      margin-top: 0px;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1;
      display: block;
      pointer-events: auto;
      cursor: pointer;
    }
    .text {
        position: fixed;
        display: block;
        font-size: 20px;
        color: #fff;
        z-index: 5;
        text-align: center;
    }
    #error {
        display: none;
        margin-top: 50px;
        color: #f00;
    }
    #recover {
        color: #cff;
        margin-top: 2px;
        margin-left: 6px;
        display: none;
    }
    .sliders {
        position: absolute;
        accent-color: #aff;
        z-index: 10;
        transform: scale(1.5);
        left: 40px;
        top: 13px;
    }
    #leninput {

        top: 70px
    }
    .text2 {
        position: absolute;
        left: 12px;
        top: 30px;
        color: #fff;
        font-size: 17px;
        z-index: 12;
    }
    #lentext {
        top: 90px
    }
</style>
<body>
    <canvas id="gamecanvas"></canvas>
    <p id="alert" class="text" style="line-height: 0.5;">Click to start <br></br> Press Esc to exit</p>
    <p id="error" class="text">Please Wait!</p>
    <p id="recover" class="text">Object Offscreen, press r to recover</p>
    <input id="capinput" class = "sliders" min = "1" max="3" step="1" type="range" value="2">
    <div class="text2" id="linecaptext">linecap: round</div>
    <input id="leninput" class = "sliders" min = "1" max="300" step="1" type="range" value="75">
    <div class="text2" id="lentext">length: 75</div>
</div>
</body>
<script>
    console.clear()


    const canvas = document.getElementById("gamecanvas");
    const ctx = canvas.getContext("2d");
    const alert = document.getElementById("alert");
    const error = document.getElementById("error");
    const recover = document.getElementById("recover");
    const sliders = document.getElementsByClassName("sliders")
    let mouseX = null;
    let mouseY = null;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let mouseLocked = true; 
    let xpos = 0;
    let ypos = 0;
    let linecap = "round"
    let mouseXv = 0;
    let mouseYv = 0;
    let posHist = [];
    let maxlength = 75;
    const trailwidth = 40;
    let mouseDown = false;
    let mouseMoved = false;
    let pointerLocked = false;
    let keysPressed = [];
    let offscreentimer = 0;
    let mode = 1;
    let t=0;


    function draw() {
        t+=1/60
        

        if (pointerLocked) {
            alert.style.display = "none";
            canvas.style.cursor = "none";

            if (xpos < 0-trailwidth || xpos > canvas.width+trailwidth || ypos < 0-trailwidth || ypos > canvas.height+trailwidth) {
                if (offscreentimer>= 50) {
                   recover.style.display = "block"
                }
                offscreentimer++;
            } else {
                recover.style.display = "none"
                offscreentimer=0;
            }

        } else {

            mouseXv = 0;
            mouseYv = 0;

            alert.style.display = "block";
            alert.style.left = `calc(100vw - ${canvas.width/2+80}px)`;
            canvas.style.cursor = "pointer";


            if (!window._hasCustomPointerLockErrorHandler) {
                window._hasCustomPointerLockErrorHandler = true;
                window.pointerLockSecurityError = false;

                document.addEventListener('pointerlockerror', () => {
                    window.pointerLockSecurityError = true;
                    console.log('pointerlockerror event received');
                    error.style.display = "block";
                });

                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === null && pointerLocked) {
                    }
                });
            }

            error.style.left =  `calc(100vw - ${canvas.width/2+77}px)`;

        }

        if (mouseXv > 0) {
            mouseXv = Math.min(mouseXv, 50);
        } else {
            mouseXv = Math.max(mouseXv, -50);
        }

        mouseMoved = false;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff"
        ctx.fillRect(0,canvas.height - 50,80,50);
        ctx.fillStyle = "#000"
        ctx.fillRect(2,canvas.height - 48,76,46);

        ctx.fillStyle = `hsl(${(t*50)%360},50%,70%)`
        ctx.fillRect(80,canvas.height - 50,80,50);
        ctx.fillStyle = "#000"
        ctx.fillRect(82,canvas.height - 48,76,46);

        ctx.fillStyle = `hsl(${(t*50)%360},50%,70%)`
        ctx.fillRect(160,canvas.height - 50,80,50);
        ctx.fillStyle = `hsl(${(t*50)%360},50%,10%)`
        ctx.fillRect(162,canvas.height - 48,76,46);


        let hue = 0;
        for (let x = 240; x < 240+80*8; x += 80) {
            ctx.fillStyle = `hsl(${hue},50%,70%)`;
            ctx.fillRect(x, canvas.height - 50, 80, 50);
            ctx.fillStyle = "#000";
            ctx.fillRect(x + 2, canvas.height - 48, 76, 46);
            hue += 45;
        }
   


        if (ypos <=  canvas.height && ypos >= canvas.height-48) {
            mode = Math.floor(xpos/80)+1
    }

        let color = 0;

        for (let i = 0; i < posHist.length - 1; i++) {
            const p0 = posHist[i];
            const p1 = posHist[i + 1];

            ctx.beginPath();

            if (mode == 2 || mode == 3) {
                ctx.strokeStyle = `hsl(${((color)+t*50)%360},50%,70%)`;
            } else if (mode == 1) {
                ctx.strokeStyle = "#fff";
            } else if (mode == 2 || mode == 3) {
                ctx.strokeStyle = "#fff";
            } else if (mode < 12) {
                ctx.strokeStyle = `hsl(${(mode-4)*45},50%,70%)`
            }

            ctx.lineWidth = 1+i*(trailwidth/maxlength)
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineCap = linecap;
            ctx.stroke();

            color+=6;
        }
   
        color = 0;

        for (let i = 0; i < posHist.length-1; i++) {
            const p0 = posHist[i];
            const p1 = posHist[i + 1];
            ctx.beginPath();
            if (mode == 3) {
                ctx.strokeStyle = `hsl(${((color)+t*50)%360},50%,10%)`;
            } else {
                ctx.strokeStyle = "#000";
            }

            ctx.lineWidth = 1+i/1.2*(trailwidth/maxlength)
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineCap = linecap;
            ctx.stroke();

            color +=6
        }


        if (pointerLocked) {
           posHist.push({ x: xpos, y: ypos });
             if (posHist.length > maxlength) {
              posHist = posHist.slice(0 - maxlength);
             }
          }

        requestAnimationFrame(draw);
    }

    draw();

    function setMode(num) {
        mode = num;
    }


    function resizeCanvas() {
        canvas.width = window.innerWidth - 25;
        canvas.height = window.innerHeight - 25;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    sliders[0].addEventListener("input", function(event) {
        const names = ["line","round","square"];
        const names2 = ["butt","round","square"]
        const value = Number(event.target.value);
        document.getElementById("linecaptext").textContent = `linecap: ${names[value-1]}`;
        linecap = names2[value-1];
    })

    sliders[1].addEventListener("input", function(event) {
        const value = Number(event.target.value);
        document.getElementById("lentext").textContent = `length: ${value}`;
        posHist = [];
        maxlength = value;
        for (let i = 0; i < maxlength; i++) {
                xpos = canvas.width/2; ypos = canvas.height/2;
                posHist.push({ x: xpos, y: ypos});
            }
    })


    let first = true;
    canvas.addEventListener("mousemove", function(event) {
        if (first) {
            for (let i = 0; i < maxlength; i++) {
                xpos = canvas.width/2; ypos = canvas.height/2;
                posHist.push({ x: xpos, y: ypos});
            }
        }

        first = false;
    })

    function handlePointerLockChange() {
        pointerLocked = (document.pointerLockElement === canvas);

        if (pointerLocked) {
            mouseXv = 0; mouseYv = 0;
            error.style.display = "none";
        } else {
            mouseX = null;
            mouseY = null;
        }
    }

    document.addEventListener('pointerlockchange', handlePointerLockChange);

    canvas.addEventListener("pointermove", function(event) {
        if (!pointerLocked) return;
        mouseXv = event.movementX;
        mouseYv = event.movementY;
        xpos += mouseXv;
        ypos += mouseYv;
        mouseMoved = true;
    });

    canvas.addEventListener("mousedown", function(event) {
        mouseDown = true;
        if (!pointerLocked && document.pointerLockElement !== canvas) {
            canvas.requestPointerLock();
        }
    });

    window.addEventListener("mouseup", function(event) {
        mouseDown = false;
    });

    window.addEventListener("blur", function() {
        if (document.pointerLockElement === canvas) {
            document.exitPointerLock();
        }
    });

    window.addEventListener('keydown', function(e) {
      keysPressed[e.key] = true;
      if (e.key == "r") {
        xpos = canvas.width/2;
        ypos = canvas.height/2
      }
      if (e.key == "f") {
        posHist = [];            posHist = [];            posHist = [];            posHist = [];            posHist = [];
      }
    });

    window.addEventListener('keyup', function(e) {
      keysPressed[e.key] = false;
    });


</script>
</html>
