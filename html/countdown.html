<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Countdown :O</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-top: 90px;
      box-sizing: border-box;
    }
    #timer-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      font-size: 62px;
      font-weight: bold;
      padding: 18px 22px;
      border-radius: 18px;
      box-shadow: 0 0 48px #0123aa;
      align-items: center;
      justify-content: center;
      max-width: 97vw;
      overflow-x: auto;
      margin: 0 auto;
      background: rgba(10,12,25,0.48);
    }
    .digit-stack {
      display: inline-block;
      position: relative;
      width: 0.7em;
      height: 1.09em;
      min-width: 34px;
      min-height: 51px;
      text-align: center;
      vertical-align: middle;
      margin: 0 0.08em;
    }
    .digit {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 1;
      transition: opacity 0.46s cubic-bezier(0.3,2,0.45,1);
      color: #fff;
      user-select: none;
      text-shadow: 0 0 5px #fffa;
      font-size: 1em;
      line-height: 1.09em;
    }
    .digit.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .digit.fade-in {
      opacity: 1;
    }
    .digit-sep {
      font-size: 0.83em;
      margin: 0 0.07em;
      opacity: 0.55;
      letter-spacing: 0.04em;
      user-select: none;
    }
    .digit-label {
      display: inline-block;
      font-size: 0.35em;
      color: #bcd;
      font-weight: 600;
      margin: 0 0.11em;
      letter-spacing: 0.01em;
      opacity: 0.55;
      user-select: none;
      vertical-align: top;
      text-align: center;
    }
    #name {
        position: relative;
        top: 0;
        width: 100vw;
        max-width: 830px;
        margin: 0 auto 8px auto;
        justify-self: center;
        text-align: center;
        text-shadow: 0 0 5px #fffa;
        font-size: 1.42em;
        font-weight: 700;
        padding-left: 10px;
        padding-right: 10px;
        word-break: break-word;
        overflow-wrap: break-word;
    }
    @media (max-width: 900px) {
      #timer-wrap { 
        font-size: 44px; 
        padding: 16px 8px;
      }
      #name {
        font-size: 1.12em;
        max-width: 99vw;
      }
    }
    @media (max-width: 600px) {
      #timer-wrap {
        font-size: 28px;
        gap: 12px;
        padding: 13px 2vw;
        max-width: 99vw;
      }
      .digit-stack { min-width: 22px; min-height: 33px; }
      .digit-label { font-size: 0.56em; }
      .digit-sep { font-size: 0.93em;}
      #name {
        font-size: 1em;
        padding-top: 6px;
        max-width: 99vw;
      }
      body {
        padding-top: 50px;
      }
    }
    @media (max-width: 375px) {
      #timer-wrap {
        font-size: 18px;
        gap: 6px;
        padding: 8px 0.5vw;
      }
      .digit-stack { min-width: 13px; min-height: 18px; }
      #name {
        font-size: .93em;
      }
    }
  </style>
</head>
<body>
  <h1 id="name"></h1>
  <div id="timer-wrap"></div>
</body>
<script>
let t = 0;
let t2 = 0;
function animateHeader() {
    t += Math.PI/60;
    t2 += Math.PI/30
    const header = document.getElementById("name");
    if (header && header.style) {
      header.style.setProperty("text-shadow", `0 0 ${(Math.sin(t)+1.5)*5}px #fffa`);
    }
    const digits = document.getElementsByClassName("digit");
    for (let i = 0; i < digits.length; i++) {
        digits[i].style.setProperty("text-shadow", `0 0 ${(Math.sin(t2)+1.5)*5}px #fffa`);
    }
    requestAnimationFrame(animateHeader);
}

animateHeader();

const countdownQueue = [
  {
    label: "TIME UNTIL THANKSGIVING BREAK",
    date: new Date(2026, 10, 23, 0, 0, 0, 0)
  },
  {
    label: "TIME UNTIL END OF FIRST SEMESTER",
    date: new Date(2026, 11, 18, 0, 0, 0, 0)
  },
  {
    label: "TIME UNTIL WINTER BREAK",
    date: new Date(2026, 11, 21, 0, 0, 0, 0)
  },
  {
    label: "TIME UNTIL MIDWINTER BREAK",
    date: new Date(2027, 0, 18, 0, 0, 0, 0)
  },
  {
    label: "TIME UNTIL SPRING BREAK",
    date: new Date(2027, 2, 9, 0, 0, 0, 0)
  },
  {
    label: "TIME UNTIL END OF THIRD QUARTER",
    date: new Date(2027, 2, 12, 0, 0, 0, 0)
  },
  {
    label: "TIME UNTIL SUMMER BREAK",
    date: new Date(2027, 4, 27, 0, 0, 0, 0)
  }
];

let currentCountdownIdx = 0;
let COUNTDOWN_END = 0;
let COUNTDOWN_LABEL = "";

function selectNextCountdown() {
  const now = new Date();
  for (let i = 0; i < countdownQueue.length; ++i) {
    if (countdownQueue[i].date.getTime() > now.getTime()) {
      currentCountdownIdx = i;
      COUNTDOWN_END = countdownQueue[i].date.getTime();
      COUNTDOWN_LABEL = countdownQueue[i].label;
      break;
    }
  }

  if (COUNTDOWN_END === 0) {
    const last = countdownQueue[countdownQueue.length - 1];
    currentCountdownIdx = countdownQueue.length - 1;
    COUNTDOWN_END = last.date.getTime();
    COUNTDOWN_LABEL = last.label;
  }
}

selectNextCountdown();
document.getElementById("name").textContent = COUNTDOWN_LABEL;

function getTimeLeftParts() {
  let ms = Math.max(0, COUNTDOWN_END - Date.now());
  let totalSec = Math.floor(ms / 1000);
  let sec = totalSec % 60;
  let min = Math.floor(totalSec / 60) % 60;
  let hr  = Math.floor(totalSec / 3600) % 24;
  let days = Math.floor(totalSec / 86400);

  return [
    String(days).padStart(2, '0'),
    String(hr).padStart(2, '0'),
    String(min).padStart(2, '0'),
    String(sec).padStart(2, '0')
  ];
}

const timerWrap = document.getElementById('timer-wrap');

function makeTimerDOM() {
  timerWrap.innerHTML = '';
  const [dd, hh, mm, ss] = getTimeLeftParts();

  for (let digit of dd) {
    const stack = document.createElement('span');
    stack.className = "digit-stack";
    const digitElem = document.createElement('span');
    digitElem.className = "digit fade-in";
    digitElem.textContent = digit;
    stack.appendChild(digitElem);
    timerWrap.appendChild(stack);
  }

  const sep1 = document.createElement('span');
  sep1.className = "digit-sep";
  sep1.textContent = ":";
  timerWrap.appendChild(sep1);

  for (let digit of hh) {
    const stack = document.createElement('span');
    stack.className = "digit-stack";
    const digitElem = document.createElement('span');
    digitElem.className = "digit fade-in";
    digitElem.textContent = digit;
    stack.appendChild(digitElem);
    timerWrap.appendChild(stack);
  }

  const sep2 = document.createElement('span');
  sep2.className = "digit-sep";
  sep2.textContent = ":";
  timerWrap.appendChild(sep2);

  for (let digit of mm) {
    const stack = document.createElement('span');
    stack.className = "digit-stack";
    const digitElem = document.createElement('span');
    digitElem.className = "digit fade-in";
    digitElem.textContent = digit;
    stack.appendChild(digitElem);
    timerWrap.appendChild(stack);
  }

  const sep3 = document.createElement('span');
  sep3.className = "digit-sep";
  sep3.textContent = ":";
  timerWrap.appendChild(sep3);

  for (let digit of ss) {
    const stack = document.createElement('span');
    stack.className = "digit-stack";
    const digitElem = document.createElement('span');
    digitElem.className = "digit fade-in";
    digitElem.textContent = digit;
    stack.appendChild(digitElem);
    timerWrap.appendChild(stack);
  }
}
makeTimerDOM();

function transitionDigit(stackElem, newDigit) {
  const oldDigit = Array.from(stackElem.children).find(
    ch => ch.classList.contains('digit') && !ch.classList.contains('fade-out')
  );

  if (!oldDigit || oldDigit.textContent === newDigit) return;

  const digitClone = document.createElement('span');
  digitClone.className = "digit";
  digitClone.textContent = newDigit;
  digitClone.style.opacity = "0";
  stackElem.appendChild(digitClone);

  setTimeout(() => {
    oldDigit.classList.add('fade-out');
    oldDigit.classList.remove('fade-in');
    digitClone.classList.add('fade-in');
  }, 0);

  digitClone.addEventListener('transitionend', function handler() {
    if (oldDigit && oldDigit.parentNode) {
      oldDigit.parentNode.removeChild(oldDigit);
    }
    digitClone.removeEventListener('transitionend', handler);
  });

  setTimeout(() => {
    digitClone.style.opacity = "";
  }, 20);
}

let prevDigits = null;
function updateTimer() {
  const [dd, hh, mm, ss] = getTimeLeftParts();
  const currentDigits = [...dd, ...hh, ...mm, ...ss];
  if (!prevDigits) prevDigits = currentDigits;

  const digitStackIdxs = [0, 1, 3, 4, 6, 7, 9, 10];
  const timerStacks = digitStackIdxs.map(i => timerWrap.children[i]);
  let di = 0;
  for (let i = 0; i < timerStacks.length; ++i) {
    if (currentDigits[di] !== prevDigits[di]) {
      transitionDigit(timerStacks[i], currentDigits[di]);
    }
    di++;
  }
  prevDigits = currentDigits;

  if (dd === "00" && hh === "00" && mm === "00" && ss === "00") {
    // See if there is another upcoming countdown
    let switched = false;
    if (currentCountdownIdx + 1 < countdownQueue.length) {
      currentCountdownIdx++;
      COUNTDOWN_END = countdownQueue[currentCountdownIdx].date.getTime();
      COUNTDOWN_LABEL = countdownQueue[currentCountdownIdx].label;
      document.getElementById("name").textContent = COUNTDOWN_LABEL;
      makeTimerDOM();
      prevDigits = null;
      switched = true;
    }
    if (!switched) return;
  }
  requestAnimationFrame(updateTimer);
}
setTimeout(updateTimer, 250);
</script>
