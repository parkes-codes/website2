<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown :O</title>
  <style>
    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #timer-wrap {
      display: flex;
      gap: 24px;
      font-size: 62px;
      font-weight: bold;
      padding: 18px 22px;
      border-radius: 18px;
      box-shadow: 0 0 48px #0123aa;
    }
    .digit-stack {
      display: inline-block;
      position: relative;
      width: 0.7em;
      height: 1.09em;
      min-width: 34px;
      min-height: 51px;
      text-align: center;
      vertical-align: middle;
      margin: 0 0.08em;
    }
    .digit {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 1;
      transition: opacity 0.46s cubic-bezier(0.3,2,0.45,1);
      color: #fff;
      user-select: none;
      text-shadow: 0 0 5px #fffa;
    }
    .digit.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .digit.fade-in {
      opacity: 1;
    }
    .digit-sep {
      font-size: 0.83em;
      margin: 0 0.07em;
      opacity: 0.55;
      letter-spacing: 0.04em;
      user-select: none;
    }
    @media (max-width: 500px) {
      #timer-wrap { font-size: 31px; padding: 15px 11px;}
    }
    #name {
        position: absolute;
        top: calc(50% - 130px);
        width: 800px;
        justify-self: center;
        text-align: center;
        text-shadow: 0 0 5px #fffa;
    }
  </style>
</head>
<body>
  <div id="timer-wrap"></div>
  <h1 id="name">HOURS UNTIL FALL BREAK</h1>
</body>
<script>
let t = 0;
let t2 = 0;
function animateHeader() {
    t += Math.PI/60;
    t2 += Math.PI/30
    const header = document.getElementById("name");
    if (header && header.style) {
      header.style.setProperty("text-shadow", `0 0 ${(Math.sin(t)+1.5)*5}px #fffa`);
    }
    const digits = document.getElementsByClassName("digit");
    for (let i = 0; i < digits.length; i++) {
        digits[i].style.setProperty("text-shadow", `0 0 ${(Math.sin(t2)+1.5)*5}px #fffa`);
    }
    requestAnimationFrame(animateHeader);
}

animateHeader();


  let COUNTDOWN_END = 0 


  function setCountdown(day, month, year, hour = 0, minute = 0) {
    const target = new Date(year, month - 1, day, hour, minute, 0, 0);
    COUNTDOWN_END = target.getTime();
  }

  setCountdown(13, 10, 2026, 14, 45);

  function getTimeLeftParts() {
    let ms = Math.max(0, COUNTDOWN_END - Date.now());
    let sec = Math.floor(ms / 1000) % 60;
    let min = Math.floor(ms / 60000) % 60;
    let hr  = Math.floor(ms / 3600000);
    return [
      String(hr).padStart(2, '0'),
      String(min).padStart(2, '0'),
      String(sec).padStart(2, '0')
    ];
  }


  const timerWrap = document.getElementById('timer-wrap');
  function makeTimerDOM() {
    timerWrap.innerHTML = '';
    const [hh, mm, ss] = getTimeLeftParts();

    const digits = [...hh, ':', ...mm, ':', ...ss];
    digits.forEach((d,i) => {
      if(d === ":") {
        const sep = document.createElement('span');
        sep.className = "digit-sep";
        sep.textContent = ":";
        timerWrap.appendChild(sep);
      } else {
        const stack = document.createElement('span');
        stack.className = "digit-stack";
        const digit = document.createElement('span');
        digit.className = "digit fade-in";
        digit.textContent = d;
        stack.appendChild(digit);
        timerWrap.appendChild(stack);
      }
    });
  }
  makeTimerDOM();


  function transitionDigit(stackElem, newDigit) {
    const oldDigit = Array.from(stackElem.children).find(
      ch => ch.classList.contains('digit') && !ch.classList.contains('fade-out')
    );

    if (!oldDigit || oldDigit.textContent === newDigit) return;


    const digitClone = document.createElement('span');
    digitClone.className = "digit";
    digitClone.textContent = newDigit;
    digitClone.style.opacity = "0";
    stackElem.appendChild(digitClone);

    setTimeout(() => {
      oldDigit.classList.add('fade-out');
      oldDigit.classList.remove('fade-in');
      digitClone.classList.add('fade-in');
    }, 0);


    digitClone.addEventListener('transitionend', function handler() {

      if (oldDigit && oldDigit.parentNode) {
        oldDigit.parentNode.removeChild(oldDigit);
      }
      digitClone.removeEventListener('transitionend', handler);
    });

    setTimeout(() => {
      digitClone.style.opacity = "";
    }, 20);
  }


  let prevDigits = null;
  function updateTimer() {
    const [hh, mm, ss] = getTimeLeftParts();
    const currentDigits = [...hh, ...mm, ...ss];
    if (!prevDigits) prevDigits = currentDigits;

    const timerStacks = Array.from(timerWrap.querySelectorAll('.digit-stack'));
    let di = 0;
    for(let i=0; i<timerStacks.length; ++i) {
      if (currentDigits[di] !== prevDigits[di]) {
        transitionDigit(timerStacks[i], currentDigits[di]);
      }
      di++;

    }
    prevDigits = currentDigits;

    if (hh === "00" && mm === "00" && ss === "00") return;
    requestAnimationFrame(updateTimer);
  }
  setTimeout(updateTimer, 250);
</script>
