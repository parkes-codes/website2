<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill Tree thingy</title>
    <link rel="icon" type="image/x-icon" href="../images/icon.ico" />
</head>
<style>
    body {
        background-color: #000;
        overflow: hidden;
    }
    #gamecanvas {
        border: #fff 5px solid;
        border-radius: 10px;
        width: calc(100vw - 11px);
        height: calc(100vh - 11px);
        margin-left: -8px;
        margin-top: -8px;
        position: relative;
        z-index: 1;
        display: block;
        background: none;
    }
</style>
<body>

 <canvas id="gamecanvas"></canvas>


</body>
<script>
const canvas = document.getElementById("gamecanvas");
const ctx = canvas.getContext('2d');
let keysPressed = [];

let fps = 60;
let fpsHist = [];
let fpsAv = 0;

const pi = Math.PI

let mx = 0, my = 0;
let t = 0;

// Camera vars
let cam = {
    x: 0,
    y: 0,
    z: 1.0, // z is the scale factor (zoom, 1 = 100%)
};
const CAM_MOVE_SPEED = 7;
const CAM_ZOOM_SPEED = 0.1;
const CAM_MIN_ZOOM = 0.1;
const CAM_MAX_ZOOM = 3.0;

function updateMousePosition(e) {
    const rect = canvas.getBoundingClientRect();
    // adjust for camera
    mx = ((e.clientX - rect.left) * (canvas.width / rect.width) - canvas.width/2) / cam.z + cam.x;
    my = (canvas.height/2 - (e.clientY - rect.top) * (canvas.height / rect.height)) / cam.z + cam.y;
}
canvas.addEventListener('mousemove', updateMousePosition);

canvas.addEventListener('wheel', (e) => {

    if (e.ctrlKey || e.altKey) return;
    let zoom = cam.z;
    if (e.deltaY < 0) {
      zoom *= (1 + CAM_ZOOM_SPEED);
    } else {
      zoom *= (1 - CAM_ZOOM_SPEED);
    }
    // clamp
    zoom = Math.max(CAM_MIN_ZOOM, Math.min(CAM_MAX_ZOOM, zoom));
    // Zoom towards mouse
    const rect = canvas.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

    // screen to "world" before-zoom pos
    const worldBeforeX = (mouseX - canvas.width/2) / cam.z + cam.x;
    const worldBeforeY = (canvas.height/2 - mouseY) / cam.z + cam.y;

    const worldAfterX = (mouseX - canvas.width/2) / zoom + cam.x;
    const worldAfterY = (canvas.height/2 - mouseY) / zoom + cam.y;

    cam.x += worldBeforeX - worldAfterX;
    cam.y += worldBeforeY - worldAfterY;

    cam.z = zoom;
    e.preventDefault();
}, {passive:false});


const tree = [
    {x: 0, y: -200, id: 1, maintext: "Base Upgrade", subtext:" The first Upgrade \nIn the skill \ntree", size: 80, particles: [], connected: [2,3,4]},
    {x: 150, y: 100, id: 2, maintext: "Extra 3", subtext:" The first additional \nUpgrade for the \nskilltree", size: 50, particles: [], connected: []},
    {x: 0, y: 150, id: 3, maintext: "Extra 2", subtext:" The second additional \nUpgrade for the \nskilltree", size: 50, particles: [], connected: []},
    {x: -150, y: 100, id: 4, maintext: "Extra 1", subtext:" The third additional \nUpgrade for the \nskilltree", size: 50, particles: [], connected: [5,6]},
    {x: -260, y: 120, id: 5, maintext: "Minor 1", subtext:" The first Sub \nUpgrade for the \nFirst extra", size: 30, particles: [], connected: []},
    {x: -200, y: 200, id: 6, maintext: "Minor 2", subtext:" The second Sub \nUpgrade for the \nFirst extra", size: 30, particles: [], connected: []},
]

// Camera pan with wasd
function updateCamera(dt) {
    if (keysPressed['w']) cam.y += CAM_MOVE_SPEED / cam.z;
    if (keysPressed['s']) cam.y -= CAM_MOVE_SPEED / cam.z;
    if (keysPressed['a']) cam.x -= CAM_MOVE_SPEED / cam.z;
    if (keysPressed['d']) cam.x += CAM_MOVE_SPEED / cam.z;
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=1/fps;

    updateCamera(1/fps);

    // camera logic: we transform all world positions -> screen
    // worldX, worldY => (canvas.width/2 + (worldX-cam.x)*cam.z, canvas.height/2 - (worldY-cam.y)*cam.z)

    for (let i = 0; i < tree.length; i++) {
        let nodeA = tree[i];
        let changexA = (Math.sin(t + i) + Math.cos(t * 1.1 + i)) * 3;
        let changeyA = (Math.cos(t + i) + Math.sin(t * 1.1 + i)) * 3;
        let ax = canvas.width / 2 + (nodeA.x + changexA - cam.x) * cam.z;
        let ay = canvas.height / 2 - (nodeA.y + changeyA - cam.y) * cam.z;

        if (nodeA.connected && nodeA.connected.length > 0) {
            for (let ci = 0; ci < nodeA.connected.length; ci++) {
                let connId = nodeA.connected[ci];

                let nodeB = tree.find(n => n.id === connId);
                if (!nodeB) continue;
                let j = tree.indexOf(nodeB);
                let changexB = (Math.sin(t + j) + Math.cos(t * 1.1 + j)) * 3;
                let changeyB = (Math.cos(t + j) + Math.sin(t * 1.1 + j)) * 3;
                let bx = canvas.width / 2 + (nodeB.x + changexB - cam.x) * cam.z;
                let by = canvas.height / 2 - (nodeB.y + changeyB - cam.y) * cam.z;

                ctx.save();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 16*cam.z;
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(bx, by);
                ctx.stroke();
                ctx.lineWidth = 12*cam.z;
                ctx.strokeStyle = "#6dd";
                ctx.stroke();
                ctx.restore();
            }
        }
    }

    for (let i = 0; i<tree.length; i++) {
        let thiss = tree[i];
        let parties = thiss.particles;
        let changex = (Math.sin(t+i)+Math.cos(t*1.1+i))*3;
        let changey = (Math.cos(t+i)+Math.sin(t*1.1+i))*3;
        for (let pii = parties.length - 1; pii >= 0; pii--) {
            parties[pii].time -= 1/fps;
            if (parties[pii].time < 0) {
                parties.splice(pii, 1); // Remove this particle
                continue;
            }
            parties[pii].x += Math.sin(parties[pii].dir)*thiss.size/500;
            parties[pii].y += Math.cos(parties[pii].dir)*thiss.size/500;

            ctx.save();
            let temp = (parties[pii].time < 0.5 && parties[pii].time >= 0) ? parties[pii].time / 2.5 : 0.2
            let alpha = temp;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(
                canvas.width / 2 + (parties[pii].x+changex-cam.x)*cam.z,
                canvas.height / 2 - (parties[pii].y+changey-cam.y)*cam.z,
                temp*thiss.size/3*cam.z,
                0, pi * 2
            );
            ctx.fillStyle = "#666";
            ctx.fill();
            ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle = "#333";
        ctx.fillStyle = "#222"
        ctx.lineWidth = 8*cam.z;
        let newx = canvas.width/2 + (thiss.x+changex-cam.x)*cam.z;
        let newy = canvas.height/2 - (thiss.y+changey-cam.y)*cam.z;
        ctx.arc(newx, newy, thiss.size*cam.z, 0, pi*2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        ctx.font = `${thiss.size*(18/80)*cam.z}px monospace`;
        ctx.fillStyle = "#fff"
        ctx.textAlign = "center"
        ctx.fillText(thiss.maintext,newx,newy-thiss.size/4*cam.z);
        ctx.font = `${thiss.size*(12/80)*cam.z}px monospace`;

        let lines = thiss.subtext.split('\n');
        let lineHeight = thiss.size*(14/80)*cam.z;
        for (let j = 0; j < lines.length; j++) {
            ctx.textAlign = "center"
            ctx.fillText(lines[j], newx, newy + thiss.size/4*cam.z + j*lineHeight-10*cam.z);
        }
   
        for (let j = 0; j< 6; j++) {
            let thisDir = Math.random()*pi*2
            parties.push({
                x:thiss.x+Math.sin(thisDir)*thiss.size,
                y:thiss.y-Math.cos(thisDir)*thiss.size,
                dir:Math.random()*pi+t+i,
                time:4
            })
        }
    }

    requestAnimationFrame(draw)
}

draw();

function resizeCanvas() {
  canvas.width = (window.innerWidth) - 25;
  canvas.height = (window.innerHeight) - 25;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

window.addEventListener("keydown", (e) => {
  keysPressed[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (e) => {
  keysPressed[e.key.toLowerCase()] = false;
});

let lastTimestamp;
function sampleFPS() {
    const now = performance.now();
    const delta = now - lastTimestamp;

    if (delta > 0 && delta < 1000) {
        fps = 1000 / delta;
    }
    fpsHist.unshift(fps)
    fpsAv = 0;
    for (let i = 0; i<fpsHist.length; i++) {
        fpsAv+=fpsHist[i];
    }
    fpsAv/=fpsHist.length;
    if (fpsHist[60]) {fpsHist.splice(60,1)}
    lastTimestamp = now;

    requestAnimationFrame(sampleFPS);
}
sampleFPS();

</script>
</html>
