    <script>
      const bounceSound = new Audio("sounds/click.wav");
      const profileLinks = Array.from(document.querySelectorAll('.profilepic-link')).map(el => {
        const rect = el.getBoundingClientRect();
        let dx = 3;
        let dy = 3;
        const w = el.offsetWidth || rect.width || 100;
        const h = el.offsetHeight || rect.height || 100;
        let sx = el.offsetLeft || rect.left;
        let sy = el.offsetTop || rect.top;
        el.style.zIndex = 14;
        el.style.pointerEvents = "auto";
        return {
          el: el,
          x: sx,
          y: sy,
          dx: dx,
          dy: dy,
          hue: 0 
        };
      });


      function openButtonLink(e) {
        let url = e.currentTarget.getAttribute('data-url');
        if (
          url && 
          e.currentTarget.tagName === 'BUTTON' &&
          e.currentTarget.getAttribute('type') !== 'submit' &&
          (!e.currentTarget.hasAttribute("onclick") || e.currentTarget.id === "funbutton")
        ) {
          // For file support
          const protocol = window.location.protocol;
          if (/*protocol !== "http:" && */protocol !== "https:") {
            if (!url.endsWith('.html')) url = url + '.html';
          }
          if (e.type === 'click' || e.key === "Enter" || e.key === " ") {
            window.open(url, "_blank");
          }
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        Array.from(document.getElementsByClassName('linkbutton')).forEach(btn => {
          if (btn.id !== "funbutton") {
            btn.addEventListener('click', openButtonLink);
            btn.addEventListener('keydown', function(e) {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openButtonLink(e);
              }
            });
          }
        });
   
      });
 

      const buttonss = document.getElementsByClassName("linkbutton");
      const searcher = document.getElementById("searchinput");
      const seeProjectsBtn = document.getElementById("seeProjectsBtn");
      const columnDiv = document.getElementById("column");
      const buttonList = columnDiv.querySelector('.button-list');
      const searchInput = document.getElementById("searchinput");

      Array.from(buttonss).forEach(btn => {
        btn.style.transform = "none";
        btn.removeAttribute('data-base-transform');
      });
 

      let projectsVisible = false;

      let isProjectsBtnOnCooldown = false;
      let cooldownTimeout = null;

      function startProjectsBtnCooldown() {
        isProjectsBtnOnCooldown = true;
        seeProjectsBtn.classList.add('cooldown');
        seeProjectsBtn.disabled = true;
        cooldownTimeout = setTimeout(() => {
          isProjectsBtnOnCooldown = false;
          seeProjectsBtn.classList.remove('cooldown');
          seeProjectsBtn.disabled = false;
        }, 3000);
      }

      function toggleProjectsSection() {
        if (isProjectsBtnOnCooldown) return; 
        startProjectsBtnCooldown();

        const links = buttonList.querySelectorAll('.linkbutton');
        if (!projectsVisible) {
          columnDiv.classList.add("visible");
          columnDiv.setAttribute('aria-hidden', 'false');

          setTimeout(() => {
            searchInput.classList.add("visible");
          }, 200);

          links.forEach((el, idx) => {
            setTimeout(() => {
              el.classList.add("visible");
            }, idx * 45 + 320);
          });

          setTimeout(() => {
            searchInput.focus();
          }, 420);

          seeProjectsBtn.textContent = "Hide projects";
          projectsVisible = true;
        } else {
          let total = links.length;

          links.forEach((el, i) => {
            setTimeout(() => {
              el.classList.remove("visible");
            }, (total - 1 - i) * 45 + 80);
          });

          setTimeout(() => {
            searchInput.classList.remove("visible");// 
          }, total * 45 + 120);

          setTimeout(() => {
            columnDiv.classList.remove("visible");
            columnDiv.setAttribute('aria-hidden', 'true');
            seeProjectsBtn.textContent = "See all projects";
          }, total * 45 + 520);

          projectsVisible = false;
        }
      }

      seeProjectsBtn.addEventListener('click', toggleProjectsSection);

      seeProjectsBtn.addEventListener("keydown", function(e) {
        if (isProjectsBtnOnCooldown) {
          e.preventDefault();
          return;
        }
        if (e.key === "Enter" || e.keyCode === 13 || e.key === " " || e.keyCode === 32) {
          e.preventDefault();
          toggleProjectsSection();
        }
      });

      searcher.addEventListener("input", function(event) {
        const searchStr = searcher.value.toLowerCase().trim();
        let prefixMatches = [];
        let otherMatches = [];

        for (let i = 0; i < buttonss.length; i++) {
          const el = buttonss[i];
          const content = el.textContent.toLowerCase();
          if (!searchStr || content.includes(searchStr)) {
            if (content.startsWith(searchStr) && searchStr !== "") {
              prefixMatches.push(el);
            } else {
              otherMatches.push(el);
            }
          }
        }

        for (let i = 0; i < buttonss.length; i++) {
          buttonss[i].style.display = "none";
        }

        let shown = 0;
        prefixMatches.forEach(el => {
          el.style.display = "";
          el.style.order = -1;
          shown++;
        });
        otherMatches.forEach((el, idx) => {
          el.style.display = "";
          el.style.order = ""; 
          shown++;
        });
      });
 


      let dvdAnimating = false;
      function updateProfileLinksDVD() {
        const scrollX = window.scrollX || window.pageXOffset || document.documentElement.scrollLeft || 0;
        const scrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
        profileLinks.forEach(obj => {
          let {el, x, y, dx, dy} = obj;
          const w = el.offsetWidth || 100;
          const h = el.offsetHeight || 100;
          const maxX = (window.innerWidth || document.documentElement.clientWidth) + scrollX - w;
          const maxY = (window.innerHeight || document.documentElement.clientHeight) + scrollY - h - 10;
          let bounced = false;
          x += dx;
          y += dy;
          if (x >= maxX) {
            dx = -Math.abs(dx);
            obj.hue += 37;
            bounced = true;
            x = maxX;
          }
          if (x <= scrollX) {
            dx = Math.abs(dx);
            obj.hue += 47;
            bounced = true;
            x = scrollX;
          }
          if (y >= maxY) {
            dy = -Math.abs(dy);
            obj.hue += 59;
            bounced = true;
            y = maxY;
          }
          if (y <= scrollY) {
            dy = Math.abs(dy);
            obj.hue += 41;
            bounced = true;
            y = scrollY;
          }
          obj.x = x;
          obj.y = y;
          obj.dx = dx;
          obj.dy = dy;
          el.style.position = window.innerWidth > 700 ? "absolute" : "fixed";
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          el.style.margin = "0"; 
          if (bounced) {
            try {
              bounceSound.currentTime = 0;
              bounceSound.play();
            } catch (e) {}
            el.style.filter = `hue-rotate(${obj.hue}deg)`;
          }
        });
        if (dvdAnimating) {
          requestAnimationFrame(updateProfileLinksDVD);
        }
      }
      let t = 0;
      const pi = Math.PI;
      const funbutton = document.getElementById("funbutton");
      const golbutton = document.getElementById("golbtn");
      const corbutton = document.getElementById("corbtn");
      const ag2text = document.getElementById("ag2text");
      const algoText = document.getElementById("algoText");
      const hacktext = document.getElementById("hacktext");
      const hacknum = document.getElementById("hacknum");
      const thingy = document.getElementById("thingy");
      const bgOverlay = document.getElementById("backgroundOverlay");
      const velkomm = document.getElementById("velkomm");

      let funclicked = false;
      const buttonOriginalTransformMap = new WeakMap();
      function getBaseTransform(el) {
        const style = window.getComputedStyle(el);
        let tf = style.transform;
        if (el.hasAttribute('data-base-transform')) {
          return el.getAttribute('data-base-transform') || "";
        } else {
          el.setAttribute('data-base-transform', tf === "none" ? "" : tf);
          return tf === "none" ? "" : tf;
        }
      }

      function randomRotate() {
        return Math.random() * 10 - 5; 
      }

      document.addEventListener('DOMContentLoaded', function() {
        const buttons = document.querySelectorAll('.button');
        const column = document.getElementById('column');
        buttons.forEach(function(btn) {
          btn.addEventListener('mouseenter', function() {
            let base = getBaseTransform(btn);
            const deg = randomRotate();
            btn.style.transform = (base ? base + " " : "") + `rotate(${deg}deg) scale(1.05)`;
            btn.style.transition = "transform 0.28s cubic-bezier(0.23,1.3,0.32,1)";
          });
          btn.addEventListener('mouseleave', function() {
            let base = btn.getAttribute('data-base-transform') || "";
            btn.style.transform = base;
          });
          btn.addEventListener('focus', function(e) {
            if (column && column.getAttribute('aria-hidden') === "true") {
              btn.blur();
              document.getElementById("linksRow").focus();
              return;
            }
            const deg = randomRotate();
            let base = getBaseTransform(btn);
            btn.style.transform = (base ? base + " " : "") + `rotate(${deg}deg) scale(1.05)`;
            btn.style.transition = "transform 0.28s cubic-bezier(0.23,1.3,0.32,1)";
          });
          btn.addEventListener('blur', function() {
            let base = btn.getAttribute('data-base-transform') || "";
            btn.style.transform = base;
          });
        });
 
 

        function adjustPfpGrid() {
          const linksRow = document.getElementById('linksRow');
          const minPfpWidth = 140 * 2 + 20 * 2
          if (window.innerWidth <= minPfpWidth + 20) {
            linksRow.style.flexDirection = "column";
            Array.from(linksRow.children).forEach(el => el.style.width = "100%");
          } else if (window.innerWidth <= 450) {
            linksRow.style.flexDirection = "row";
            Array.from(linksRow.children).forEach(el => el.style.width = "45%");
          } else {
            linksRow.style.flexDirection = "row";
            Array.from(linksRow.children).forEach(el => el.style.width = "");
          }
        }
        adjustPfpGrid();
        window.addEventListener('resize', adjustPfpGrid);

        const searchBar = document.getElementById("searchinput");

        searchBar.addEventListener("focus", () => {
          if (column && column.getAttribute('aria-hidden') === "true") {
            searchBar.blur();
            document.getElementById("linksRow").focus();
          }
        })
      });

      function randomDxDy() {
        let dx = 0, dy = 0;
        while (Math.abs(dx) < 1.5) {
          dx = Math.random() * 10 - 5;
        }
        while (Math.abs(dy) < 1.5) {
          dy = Math.random() * 10 - 5;
        }
        return { dx, dy };
      }

      function movestuff() {
        if (!funclicked) {
          profileLinks.forEach(obj => {
            const {dx, dy} = randomDxDy();
            obj.dx = dx;
            obj.dy = dy;
          });
          if (profileLinks.length > 0 && !dvdAnimating) {
            profileLinks.forEach(obj => {
              const el = obj.el;
              el.style.position = window.innerWidth > 700 ? 'absolute' : 'fixed';
              el.style.left = `${obj.x}px`;
              el.style.top = `${obj.y}px`;
              el.style.margin = "0"; 
              el.style.zIndex = 14;
            });
            dvdAnimating = true;
            requestAnimationFrame(updateProfileLinksDVD);
          }
        } 
        funclicked = true;
        const texts = document.getElementsByClassName("text");
        for (let i = 0; i < texts.length; i++) {
          texts[i].style.color = `hsl(${t * 100 % 360}, 50%, 70%)`;
          texts[i].style.transform = `rotate(${Math.sin(t + i) * 10}deg) scale(${Math.sin(t*2+i)*0.1+1})`;
        }

        bgOverlay.style.backgroundColor = `hsla(${(t*30)%360},50%,50%,0.3)`

        requestAnimationFrame(movestuff);
      }
      function tick() {
        t += 0.1;
        if (funbutton)
          funbutton.style.borderColor = `hsl(${(t * 50) % 360},50%,80%)`;
        if (golbutton)
          golbutton.style.color = `hsl(0,0%,${(Math.sin(t)) * 10 + 85}%)`;
        if (corbutton) 
          corbutton.style.textShadow = `0px 0px ${Math.sin(t/4)*2+3}px #ffff`
        if (ag2text)
          ag2text.style.color = `hsl(200,50%,${(Math.sin(t)) * 8 + 85}%)`;
        if (algoText) {
          algoText.style.color = `hsl(${(t*30)%360},50%,90%)`;
        }
        if (hacknum) {
          let temp = "";
          for (let i = 0; i < 10; i++) {
            temp += Math.floor(Math.random() * 2);
          }
          hacknum.textContent = temp;
        }

        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
